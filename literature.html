<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Literature</title>

<script src="https://d3js.org/d3.v7.min.js"></script>
<style>/* ---- Theme tokens (dark default; light via ☀/🌙 toggle or OS preference) ---- */
:root{color-scheme:dark;--bg:#0d0d1a;--bg2:#0f0f20;--panel:#12122a;--surface:#1a1a38;--btn2:#1e1e40;--border:#2a2a50;--link:#3a3a6a;--c444:#444;--c555:#555;--c666:#666;--c888:#888;--c999:#999;--caaa:#aaa;--cccc:#ccc;--cddd:#ddd;--text:#e0e0f0;--tint-pink:#2a0a18;--tint-amber:#221a08;--tint-yellow:#1a1a08;--tint-green:#0f2a22;--tint-teal:#0a1a1a;--accent:#818cf8;--strong:#fff;--shadow:rgba(0,0,0,.6)}
:root[data-theme="light"]{color-scheme:light;--bg:#f4f5fa;--bg2:#eef0f6;--panel:#ffffff;--surface:#eef0f7;--btn2:#e8eaf3;--border:#d9dcea;--link:#b4b8d4;--c444:#7d809a;--c555:#6b6e8a;--c666:#5f627e;--c888:#555870;--c999:#4f5269;--caaa:#3f4259;--cccc:#2e3048;--cddd:#262840;--text:#1d1e35;--tint-pink:#fde7f1;--tint-amber:#ffefcc;--tint-yellow:#fff6db;--tint-green:#dff7ee;--tint-teal:#dff5f5;--accent:#4f46e5;--strong:#1d1e35;--shadow:rgba(30,30,60,.18)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){color-scheme:light;--bg:#f4f5fa;--bg2:#eef0f6;--panel:#ffffff;--surface:#eef0f7;--btn2:#e8eaf3;--border:#d9dcea;--link:#b4b8d4;--c444:#7d809a;--c555:#6b6e8a;--c666:#5f627e;--c888:#555870;--c999:#4f5269;--caaa:#3f4259;--cccc:#2e3048;--cddd:#262840;--text:#1d1e35;--tint-pink:#fde7f1;--tint-amber:#ffefcc;--tint-yellow:#fff6db;--tint-green:#dff7ee;--tint-teal:#dff5f5;--accent:#4f46e5;--strong:#1d1e35;--shadow:rgba(30,30,60,.18)}}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* ---- Header ---- */
#header{background:var(--panel);padding:8px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-shrink:0;gap:12px}
#header h1{font-size:16px;font-weight:700;color:var(--accent);white-space:nowrap;letter-spacing:.5px}
.view-tabs{display:flex;gap:4px}
.view-tab{padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:none;color:var(--c888);cursor:pointer;font-size:12px;font-weight:500;transition:all .2s}
.view-tab:hover{background:var(--btn2);color:var(--caaa)}
.view-tab.active{background:#4361ee;color:#fff;border-color:#4361ee}
.hdr-actions{display:flex;gap:6px;align-items:center}
#theme-btn{font-size:13px;line-height:1;min-width:30px}
.nav-link{font-size:12px;color:var(--c888);text-decoration:none;padding:4px 6px;white-space:nowrap}
.nav-link:hover{color:var(--accent)}

/* ---- Layout ---- */
#main{display:flex;flex:1;overflow:hidden}

/* ---- Sidebar ---- */
#sidebar{width:270px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden}
.tab-bar{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;flex:1}
/* Collapsible sidebar (starts collapsed): a thin vertical strip with » and a vertical label */
#sidebar{transition:width .18s ease}
.sb-head{display:flex;align-items:stretch;flex-shrink:0}
#sb-toggle{background:none;border:none;border-bottom:1px solid var(--border);border-left:1px solid var(--btn2);color:var(--c666);cursor:pointer;padding:0 10px;font-size:13px;display:flex;align-items:center;gap:8px}
#sb-toggle:hover{background:var(--surface);color:var(--accent)}
#sb-toggle .sb-vlabel{display:none}
#sidebar.collapsed{width:32px}
#sidebar.collapsed .sb-head{flex:1;flex-direction:column}
#sidebar.collapsed .tab-bar,#sidebar.collapsed .tab-content{display:none}
#sidebar.collapsed #sb-toggle{flex:1;flex-direction:column;justify-content:flex-start;padding:12px 0;border:none}
#sidebar.collapsed #sb-toggle .sb-vlabel{display:block;writing-mode:vertical-rl;font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase}
.tab-btn{flex:1;padding:9px 4px;background:none;border:none;color:var(--c666);cursor:pointer;font-size:11px;font-weight:600;letter-spacing:.3px;transition:all .2s;text-transform:uppercase}
.tab-btn:hover{background:var(--surface);color:var(--caaa)}
.tab-btn.active{color:var(--accent);border-bottom:2px solid var(--accent)}
.tab-content{display:none;padding:14px;flex:1;overflow-y:auto}
.tab-content.active{display:block}

/* ---- Forms ---- */
.form-group{margin-bottom:12px}
label{display:block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--c666);margin-bottom:5px}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:6px;font-size:12px;outline:none;transition:border-color .2s;font-family:inherit}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
/* Number fields (Year, N, Min N): plain boxes, no spinner arrows */
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
textarea{resize:vertical;min-height:70px}
select option{background:var(--panel)}

/* ---- Buttons ---- */
.btn{padding:7px 12px;border-radius:6px;border:none;cursor:pointer;font-size:12px;font-weight:600;transition:all .2s;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.btn-primary{background:#4361ee;color:#fff}.btn-primary:hover{background:#3451d1}
.btn-secondary{background:var(--btn2);color:var(--caaa);border:1px solid var(--border)}.btn-secondary:hover{background:var(--border);color:var(--cddd)}
.btn-danger{background:#f72585;color:#fff}.btn-danger:hover{background:#d61f74}
.btn-sm{padding:4px 10px;font-size:11px}
.btn-full{width:100%;justify-content:center}

/* ---- Type selector ---- */
.type-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:14px}
.type-card{padding:8px 4px;border-radius:8px;border:2px solid transparent;cursor:pointer;text-align:center;font-size:11px;font-weight:600;transition:all .2s;background:var(--bg)}
.type-card.selected{border-color:currentColor}
.type-icon{font-size:16px;display:block;margin-bottom:3px}

/* ---- View area (Studies / Timeline + detail panel) ---- */
#graph-container{flex:1;position:relative;overflow:hidden;background:var(--bg)}

/* ---- Detail panel ---- */
.dp-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.dp-title{font-size:15px;font-weight:700;line-height:1.3;flex:1;margin-right:8px;min-width:0;overflow-wrap:anywhere}
.dp-badge{font-size:10px;padding:3px 8px;border-radius:12px;font-weight:700;letter-spacing:.3px;white-space:nowrap}
.dp-meta{font-size:11px;color:var(--c666);margin-bottom:10px;line-height:1.6}
.dp-desc{font-size:12px;color:var(--caaa);line-height:1.7;margin-bottom:12px;white-space:pre-wrap;overflow-wrap:anywhere}
.dp-summary{font-size:12px;color:var(--cddd);line-height:1.6;margin-bottom:10px;padding:8px 10px;background:var(--bg);border-left:3px solid #4361ee;border-radius:4px;overflow-wrap:anywhere}
.dp-url{display:block;font-size:11px;color:#4cc9f0;margin-bottom:10px;overflow-wrap:anywhere;text-decoration:none}
.dp-url:hover{text-decoration:underline}
.tag.proj{background:var(--tint-green);color:#06d6a0;cursor:pointer}
.dp-section-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--c555);margin-bottom:8px}
.conn-item{display:flex;align-items:center;gap:8px;padding:7px 9px;background:var(--bg);border-radius:6px;margin-bottom:5px;cursor:pointer;transition:background .2s;border:1px solid transparent}
.conn-item:hover{background:var(--surface);border-color:var(--border)}
.conn-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.conn-name{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conn-rel{font-size:10px;color:var(--c666)}


/* ---- Timeline view ---- */
#timeline-container{position:absolute;inset:0;background:var(--bg);display:none;flex-direction:column}
#timeline-container.active{display:flex}
#tl-bar{background:var(--bg);border-bottom:1px solid var(--border);padding:10px 24px;display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;flex-shrink:0;font-size:12px}
#tl-bar select{width:auto;max-width:220px}
#tl-bar input[type=text]{width:180px}
.tl-field{color:var(--c666);font-weight:600}
#tl-types{display:flex;gap:10px;flex-wrap:wrap;margin-right:8px}
.tl-check{display:inline-flex;align-items:center;gap:4px;color:var(--cccc);cursor:pointer;font-size:12px;text-transform:none;letter-spacing:0;margin:0;font-weight:400}
.tl-check input{width:auto;margin:0 2px 0 0;accent-color:var(--accent)}
.tl-uname{text-decoration-thickness:2px;text-underline-offset:3px}
.tl-check:hover .tl-uname{text-decoration-line:underline}
.tl-check .n{color:var(--c666);font-variant-numeric:tabular-nums}
#tl-count{margin-left:auto;color:var(--c666);font-variant-numeric:tabular-nums}
#tl-scroll{flex:1;overflow-y:auto;overflow-x:hidden}
#timeline-svg{display:block}

/* ---- Stats ---- */

/* ---- Search results ---- */

/* ---- Tags ---- */
.tag{display:inline-block;background:var(--btn2);color:var(--accent);padding:2px 7px;border-radius:10px;font-size:10px;margin:2px;font-weight:500}
.tag.gap{background:var(--tint-pink);color:#f72585}

/* ---- Status bar ---- */
#status-bar{background:var(--panel);padding:5px 14px;font-size:11px;color:var(--c555);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.save-dot{width:7px;height:7px;border-radius:50%;background:#06d6a0;display:inline-block;margin-right:6px}
.save-dot.dirty{background:#f77f00;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}


/* ---- Toast ---- */
#toast{position:fixed;bottom:44px;left:50%;transform:translateX(-50%) translateY(10px);background:var(--btn2);color:var(--text);border:1px solid var(--border);padding:8px 18px;border-radius:8px;font-size:12px;opacity:0;transition:all .3s;z-index:2000;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---- Modal ---- */



/* ---- Link popup ---- */
#link-popup{position:absolute;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;z-index:50;display:none;min-width:220px;box-shadow:0 4px 24px var(--shadow)}
#link-popup.open{display:block}
#link-popup .lp-from-to{font-size:10px;color:var(--c555);margin-bottom:8px;line-height:1.5}
#link-popup .lp-from-to strong{color:var(--caaa)}

/* ---- Relink banner ---- */
#relink-banner{background:var(--tint-yellow);border-bottom:1px solid #f77f0055;padding:6px 14px;font-size:12px;color:#f77f00;display:none;align-items:center;gap:10px;flex-shrink:0;cursor:pointer}
#relink-banner:hover{background:var(--tint-amber)}
#relink-banner span{flex:1}

/* ---- Connection edit row ---- */
.conn-item{display:flex;align-items:center;gap:7px;padding:6px 8px;background:var(--bg);border-radius:6px;margin-bottom:5px;border:1px solid transparent;transition:background .2s}
.conn-nav{flex:1;min-width:0;cursor:pointer}
.conn-acts{display:flex;gap:3px;flex-shrink:0;opacity:0;transition:opacity .2s}
.conn-item:hover .conn-acts{opacity:1}
.cact{padding:3px 6px;border-radius:5px;border:none;cursor:pointer;font-size:10px;background:var(--btn2);color:var(--c888);transition:all .15s}
.cact:hover{background:var(--border);color:var(--text)}
.cact.del:hover{background:#f72585;color:#fff}

/* ---- Category badge list ---- */




/* ---- Scrollbar ---- */
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* ---- Divider ---- */
hr.div{border:none;border-top:1px solid var(--btn2);margin:12px 0}

/* ---- File indicator ---- */
#file-name{font-size:11px;color:var(--c555);max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---- Timeline ---- */
#timeline-svg{font:12px system-ui,-apple-system,sans-serif;color:var(--text);
  --glass-top:rgba(255,255,255,.10);--glass-bot:rgba(255,255,255,.025);--glass-edge-top:rgba(255,255,255,.28);--glass-edge-bot:rgba(255,255,255,.04);--glass-shadow:rgba(0,0,0,.45)}
:root[data-theme="light"] #timeline-svg{--glass-top:rgba(255,255,255,.85);--glass-bot:rgba(255,255,255,.35);--glass-edge-top:rgba(255,255,255,1);--glass-edge-bot:rgba(140,150,200,.30);--glass-shadow:rgba(40,40,90,.12)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) #timeline-svg{--glass-top:rgba(255,255,255,.85);--glass-bot:rgba(255,255,255,.35);--glass-edge-top:rgba(255,255,255,1);--glass-edge-bot:rgba(140,150,200,.30);--glass-shadow:rgba(40,40,90,.12)}}
.tl-g1{stop-color:var(--glass-top)}.tl-g2{stop-color:var(--glass-bot)}
.tl-e1{stop-color:var(--glass-edge-top)}.tl-e2{stop-color:var(--glass-edge-bot)}
.tl-title{font-size:15px;font-weight:600;fill:var(--text)}
.tl-subtitle{font-size:12px;fill:var(--c666)}
.tl-domain{stroke:currentColor;stroke-opacity:.6;fill:none}
.tl-tick{stroke:currentColor;stroke-opacity:.6}
.tl-year{font-size:11px;fill:var(--c888);font-variant-numeric:tabular-nums}
.tl-break{fill:var(--c666)}
.tl-rule{stroke:currentColor;stroke-opacity:.12}
.tl-item{cursor:pointer;outline:none}
.tl-label{font-size:12px;fill:var(--cccc);pointer-events:none}
.tl-hit{fill:url(#tl-glass);stroke:url(#tl-glass-edge);stroke-width:1;filter:drop-shadow(0 1px 3px var(--glass-shadow));transition:filter .15s}
.tl-item:hover .tl-hit,.tl-item:focus-visible .tl-hit{filter:drop-shadow(0 3px 10px var(--glass-shadow)) brightness(1.08)}
.tl-under{stroke-width:2;stroke-linecap:round;opacity:0;transition:opacity .12s}
.tl-item:hover .tl-under,.tl-item:focus-visible .tl-under{opacity:1}
.tl-item:hover .tl-label,.tl-item:focus-visible .tl-label{fill:var(--text)}
.tl-note{font-size:12px;fill:var(--c666)}

/* ---- Studies view ---- */
#studies-container{position:absolute;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:12}
#studies-container.active{display:flex}
#st-bar{background:var(--panel);border-bottom:1px solid var(--border);padding:10px 14px;display:flex;align-items:center;gap:8px;flex-shrink:0;flex-wrap:wrap}
#st-bar input[type=text]{width:auto;flex:1;min-width:200px}
#st-body{display:flex;flex:1;overflow:hidden}
#st-rail{width:220px;background:var(--panel);border-right:1px solid var(--border);overflow-y:auto;padding:12px;flex-shrink:0;transition:width .18s ease}
#st-rail.collapsed{width:32px;padding:0;overflow:hidden}
.st-railhead{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}
.st-railtoggle{background:none;border:none;color:var(--c666);cursor:pointer;font-size:13px;padding:0 4px;line-height:1}
.st-railtoggle:hover{color:var(--accent)}
.st-railtoggle .sb-vlabel{display:none}
#st-rail.collapsed .st-railtoggle{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 0}
#st-rail.collapsed .st-railtoggle:hover{background:var(--surface)}
#st-rail.collapsed .st-railtoggle .sb-vlabel{display:block;writing-mode:vertical-rl;font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase}
.st-proj{display:flex;align-items:center;gap:6px;padding:7px 9px;border-radius:6px;cursor:pointer;font-size:12px;color:var(--cccc);margin-bottom:3px;border:1px solid transparent}
.st-proj:hover{background:var(--surface)}
.st-proj.active{background:var(--btn2);border-color:#4361ee;color:#fff}
.st-proj-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.st-proj-count{font-size:10px;color:var(--accent);font-weight:700}
#st-main{flex:1;overflow-y:auto;padding:16px 18px;min-width:0}
.st-head{margin-bottom:12px}
.st-head h2{font-size:18px;color:var(--text);margin-bottom:4px;overflow-wrap:anywhere}
.st-head .st-sub{font-size:12px;color:var(--c666)}
.st-section{background:var(--panel);border:1px solid var(--btn2);border-radius:8px;padding:10px 12px;margin-bottom:12px}
.st-section-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--c555);margin-bottom:6px;display:flex;align-items:center;gap:8px}
.st-chip{display:inline-block;background:var(--btn2);color:var(--accent);padding:3px 9px;border-radius:12px;font-size:11px;margin:2px;cursor:pointer;border:1px solid transparent;user-select:none}
.st-chip:hover{border-color:var(--accent)}
.st-chip.on{background:#4361ee;color:#fff}
.st-chip .n{opacity:.6;margin-left:4px;font-size:10px}
.st-kwbox > summary{cursor:pointer;margin-bottom:0;user-select:none;list-style:none}
.st-kwbox > summary::-webkit-details-marker{display:none}
.st-kwbox > summary::before{content:'▸';display:inline-block;width:10px;transition:transform .15s}
.st-kwbox[open] > summary::before{transform:rotate(90deg)}
.st-kwbox[open] > summary{margin-bottom:6px}
.st-kwactive{text-transform:none;letter-spacing:0;font-weight:600;color:#fff;background:#4361ee;border-radius:10px;padding:1px 8px}
.st-kwtools{display:flex;gap:6px;margin-bottom:4px}
.st-kwrow{margin:3px 0;line-height:1.9}
.st-kwgroup{display:inline-block;min-width:86px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--c666);margin-right:4px}
.st-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.st-card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0;overflow:hidden;overflow-wrap:anywhere}
.st-card:hover{border-color:var(--link)}
.st-card-top{display:flex;align-items:flex-start;gap:8px}
.st-title{flex:1;min-width:0;font-size:14px;font-weight:700;line-height:1.35;color:var(--text);text-decoration:none}
a.st-title:hover{color:var(--accent);text-decoration:underline}
.st-url{font-size:11px;color:#4cc9f0;text-decoration:none;overflow-wrap:anywhere}
.st-url:hover{text-decoration:underline}
.st-meta{font-size:11px;color:var(--c666);line-height:1.5}
.st-summary{font-size:12.5px;color:var(--cccc);line-height:1.6}
.st-summary.empty{color:var(--c555);font-style:italic;cursor:pointer}
.st-also{font-size:10px;color:var(--c555)}
.st-card details summary{font-size:11px;color:var(--accent);cursor:pointer;user-select:none}
.st-notes{margin-top:6px;font-size:11.5px;color:var(--c999);line-height:1.6;white-space:pre-wrap;max-height:260px;overflow-y:auto;background:var(--bg);border-radius:6px;padding:8px 10px}
.st-foot{display:flex;gap:6px;margin-top:auto;padding-top:4px}
.st-empty{color:var(--c555);font-size:13px;text-align:center;padding:40px 10px}
/* Edit tab: cards collapse to a vertical strip, the edit form takes the main area */
#st-cards-strip{display:none;width:32px;flex-shrink:0;background:var(--panel);border:none;border-right:1px solid var(--border);color:var(--c666);cursor:pointer;flex-direction:column;align-items:center;gap:8px;padding:12px 0;font-size:13px}
#st-cards-strip:hover{background:var(--surface);color:var(--accent)}
#st-cards-strip .sb-vlabel{writing-mode:vertical-rl;font-size:10px;font-weight:700;letter-spacing:.8px;text-transform:uppercase}
#st-edit,#st-detail{display:none;flex:1;overflow-y:auto;padding:16px 18px;min-width:0}
#studies-container.paned #st-bar,#studies-container.paned #st-main{display:none}
#studies-container.paned #st-cards-strip{display:flex}
#studies-container[data-pane="edit"] #st-edit,#studies-container[data-pane="details"] #st-detail{display:block}
.st-edit-box{max-width:780px;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:18px 20px}
.st-edit-box h3{margin-bottom:16px;font-size:15px;color:var(--text);overflow-wrap:anywhere}
#st-detail .dp-title{font-size:18px}
#st-detail .dp-summary,#st-detail .dp-desc{font-size:13px}
.dp-links{margin-bottom:12px}
.dp-addlink{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px;padding-top:10px;border-top:1px solid var(--btn2)}
.dp-addlink input[type=text]{width:130px}
.dp-addlink select{flex:1;min-width:180px;width:auto}
.dp-addlink label,.lp-bidi{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--c888);text-transform:none;letter-spacing:0;margin:0;cursor:pointer;white-space:nowrap}
.dp-addlink input[type=checkbox],.lp-bidi input{width:auto;margin:0}
.st-links{font-size:11px;color:var(--c888);line-height:1.6}
.st-links b{color:var(--caaa);font-weight:600}
.st-link{color:var(--accent);cursor:pointer}
.st-usedby{display:inline-block;margin-left:2px;padding:1px 8px;border-radius:10px;background:var(--btn2);color:var(--accent);font-weight:600;cursor:pointer;border:1px solid transparent}
.st-usedby:hover{border-color:var(--accent)}
.st-link:hover{text-decoration:underline}
#em-desc{min-height:220px}
</style>
</head>
<body>

<!-- Re-link banner (shown when file handle needs permission re-grant) -->
<div id="relink-banner">
  <span>⚡ literature.json was previously linked. Click to re-grant access and enable auto-save.</span>
  <button class="btn btn-secondary btn-sm" id="btn-relink" onclick="sync.relink()" style="flex-shrink:0">Re-link File</button>
  <button style="background:none;border:none;color:#f77f00;cursor:pointer;font-size:14px;flex-shrink:0" onclick="document.getElementById('relink-banner').style.display='none'">×</button>
</div>

<!-- Header -->
<div id="header">
  <h1>⬡ Literature</h1>
  <div class="view-tabs">
    <button class="view-tab active" data-view="studies">📚 Studies</button>
    <button class="view-tab" data-view="timeline">Timeline</button>
    <button class="view-tab" data-view="details" id="details-tab" hidden>ⓘ Details</button>
    <button class="view-tab" data-view="edit" id="edit-tab" hidden>✏ Edit</button>
  </div>
  <div class="hdr-actions">
    <a class="nav-link" href="knowledge.html">Knowledge</a>
    <a class="nav-link" href="worklist.html">Worklist</a>
    <span id="file-name">No file linked</span>
    <button class="btn btn-secondary btn-sm" id="btn-open">📂 Open</button>
    <button class="btn btn-secondary btn-sm" id="btn-save">💾 Save</button>
    <button class="btn btn-secondary btn-sm" id="btn-export">⬇ Export</button>
    <button class="btn btn-secondary btn-sm" id="theme-btn" onclick="toggleTheme()" aria-label="Toggle dark/light theme"></button>
  </div>
</div>

<div id="main">
  <!-- Sidebar -->
  <div id="sidebar" class="collapsed">
    <div class="sb-head">
      <div class="tab-bar">
        <button class="tab-btn active" data-tab="add">Add</button>
        <button class="tab-btn" data-tab="connect">Link</button>
      </div>
      <button id="sb-toggle" title="Show sidebar (Add / Link)" aria-expanded="false">
        <span class="sb-arrow">»</span><span class="sb-vlabel">Add · Link</span>
      </button>
    </div>

    <!-- Add Tab -->
    <div class="tab-content active" id="tab-add">
      <div class="form-group">
        <label>Node Type</label>
        <div class="type-grid" id="type-grid">
          <div class="type-card selected" data-type="Applied" style="color:#4361ee">
            <span class="type-icon">🔬</span>Applied
          </div>
          <div class="type-card" data-type="Model" style="color:#7209b7">
            <span class="type-icon">🧠</span>Model
          </div>
          <div class="type-card" data-type="Method" style="color:#4cc9f0">
            <span class="type-icon">🛠</span>Method
          </div>
          <div class="type-card" data-type="Data" style="color:#06d6a0">
            <span class="type-icon">🗃</span>Data
          </div>
          <div class="type-card" data-type="Review" style="color:#f72585">
            <span class="type-icon">📝</span>Review
          </div>
          <div class="type-card" data-type="Toolbox" style="color:#f77f00">
            <span class="type-icon">🧰</span>Toolbox
          </div>
        </div>
      </div>
      <div class="form-group">
        <label>Title / Name</label>
        <input type="text" id="node-label" placeholder="e.g. paper / article / book title" />
      </div>
      <div class="form-group">
        <label>Study / Project</label>
        <input type="text" id="node-projects" list="project-list" placeholder="e.g. physio patterns (comma-separate for several)" />
      </div>
      <div class="form-group">
        <label>URL</label>
        <input type="text" id="node-url" placeholder="https://…" />
      </div>
      <div id="paper-fields">
        <div class="form-group">
          <label>Authors</label>
          <input type="text" id="node-authors" placeholder="e.g. Smith et al." />
        </div>
        <div class="form-group" style="display:flex;gap:8px">
          <div style="flex:1">
            <label>Year</label>
            <input type="number" id="node-year" placeholder="2024" min="1900" max="2030" />
          </div>
          <div style="flex:1">
            <label>Venue</label>
            <input type="text" id="node-venue" placeholder="Journal / venue" />
          </div>
          <div style="flex:0 0 72px">
            <label>N subj.</label>
            <input type="number" id="node-subjects" placeholder="N" min="0" title="Number of participants / subjects" />
          </div>
        </div>
      </div>
      <div class="form-group">
        <label>Summary (2–4 sentences)</label>
        <textarea id="node-summary" style="min-height:56px" placeholder="What it found / why it matters for this study"></textarea>
      </div>
      <div class="form-group">
        <label>Notes / Abstract <span style="text-transform:none;letter-spacing:0;opacity:.7">· **bold** __underline__ *italic*</span></label>
        <textarea id="node-desc" placeholder="Key contributions, findings, or description..."></textarea>
      </div>
      <div class="form-group">
        <label>Keywords / Tags</label>
        <input type="text" id="node-tags" placeholder="e.g. heart rate, sleep, wearables (saved lowercase)" />
        <datalist id="project-list"></datalist>
      </div>
      <button class="btn btn-primary btn-full" id="btn-add-node">+ Add Node</button>
    </div>

    <!-- Connect Tab -->
    <div class="tab-content" id="tab-connect">
      <div class="form-group">
        <label>From</label>
        <select id="edge-src"><option value="">Select source...</option></select>
      </div>
      <div class="form-group">
        <label>Relationship</label>
        <select id="edge-rel-preset">
          <option value="">— preset —</option>
          <option>uses</option><option>extends</option><option>cites</option>
          <option>addresses</option><option>leaves_open</option><option>trained_on</option>
          <option>compared_to</option><option>outperforms</option><option>overlaps</option>
        </select>
        <input type="text" id="edge-rel" placeholder="Or type custom..." style="margin-top:6px" />
      </div>
      <div class="form-group">
        <label>To</label>
        <select id="edge-tgt"><option value="">Select target...</option></select>
      </div>
      <div class="form-group">
        <label class="lp-bidi" title="Off: From → To only. On: both directions (A ↔ B)"><input type="checkbox" id="edge-bidi" /> ↔ Both directions</label>
      </div>
      <datalist id="rel-list"><option>uses</option><option>extends</option><option>cites</option><option>addresses</option><option>leaves_open</option><option>trained_on</option><option>compared_to</option><option>outperforms</option><option>overlaps</option></datalist>
      <button class="btn btn-primary btn-full" id="btn-add-edge">+ Add Connection</button>
    </div>

  </div>

  <!-- View container: Studies / Timeline + detail panel -->
  <div id="graph-container">
    <!-- Timeline overlay -->
    <div id="timeline-container">
      <div id="tl-bar">
        <span class="tl-field">Type</span>
        <span id="tl-types" role="group" aria-label="Filter by type (none checked = all)"></span>
        <span class="tl-field">Project</span>
        <select id="tl-project" aria-label="Project"></select>
        <span class="tl-field">Search</span>
        <input type="text" id="tl-q" placeholder="title, author, tag" aria-label="Search" />
        <span id="tl-count" aria-live="polite"></span>
      </div>
      <div id="tl-scroll"><svg id="timeline-svg"></svg></div>
    </div>

    <!-- Studies view -->
    <div id="studies-container">
      <div id="st-bar">
        <input type="text" id="st-q" placeholder="Search a study / project…  e.g. physio patterns" />
        <input type="text" id="st-filter" placeholder="Filter within results…" style="max-width:240px" />
        <input type="number" id="st-nmin" placeholder="Min N" min="0" title="Only items with at least this many subjects" style="max-width:84px" />
        <select id="st-sort" title="Sort the cards" style="width:auto">
          <option value="added">Sort: date added</option>
          <option value="used">Sort: most used</option>
          <option value="n">Sort: number of subjects</option>
        </select>
        <button class="btn btn-secondary btn-sm" id="st-copy">⧉ Copy as Markdown</button>
      </div>
      <div id="st-body">
        <div id="st-rail"></div>
        <button id="st-cards-strip" title="Show the cards (Details / Edit stay open in their tabs)">»<span class="sb-vlabel">Cards</span></button>
        <div id="st-main"></div>
        <!-- Details tab (replaces the old slide-in detail panel) -->
        <div id="st-detail">
          <div class="st-edit-box">
            <div class="dp-header">
              <div class="dp-title" id="dp-title"></div>
              <span class="dp-badge" id="dp-badge"></span>
            </div>
            <div class="dp-meta" id="dp-meta"></div>
            <div id="dp-projects" style="margin-bottom:8px"></div>
            <a class="dp-url" id="dp-url" target="_blank" rel="noopener"></a>
            <div class="dp-summary" id="dp-summary"></div>
            <div class="dp-desc" id="dp-desc"></div>
            <div id="dp-tags" style="margin-bottom:10px"></div>
            <div style="display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap">
              <button class="btn btn-secondary btn-sm" id="dp-edit">✏ Edit</button>
              <button class="btn btn-danger btn-sm" id="dp-delete">Delete</button>
              <button class="btn btn-secondary btn-sm" style="margin-left:auto" id="dp-close" title="Close Details (Esc)">× Close</button>
            </div>
            <div id="dp-connections"></div>
            <div class="dp-addlink">
              <span class="dp-section-title" style="margin:0">+ Link</span>
              <span style="font-size:11px;color:var(--c666)">this</span>
              <input type="text" id="dl-rel" list="rel-list" placeholder="uses, cites…" />
              <span style="font-size:11px;color:var(--c666)" id="dl-arrow">→</span>
              <select id="dl-tgt"></select>
              <label title="Both directions (A ↔ B), e.g. overlaps / compared_to"><input type="checkbox" id="dl-bidi" /> ↔ both ways</label>
              <button class="btn btn-primary btn-sm" id="dl-add">Add</button>
            </div>
          </div>
        </div>
        <!-- Edit tab (replaces the old Edit popup) -->
        <div id="st-edit">
          <div class="st-edit-box">
            <h3 id="em-title">Edit Node</h3>
            <div class="form-group"><label>Label</label><input type="text" id="em-label" /></div>
            <div class="form-group" style="display:flex;gap:8px">
              <div style="flex:0 0 140px"><label>Type</label><select id="em-type">
                <option>Applied</option><option>Model</option><option>Method</option>
                <option>Data</option><option>Review</option><option>Toolbox</option>
              </select></div>
              <div style="flex:1"><label>Study / Project</label><input type="text" id="em-projects" list="project-list" placeholder="comma-separated" /></div>
            </div>
            <div class="form-group"><label>URL</label><input type="text" id="em-url" /></div>
            <div class="form-group"><label>Authors</label><input type="text" id="em-authors" /></div>
            <div class="form-group" style="display:flex;gap:8px">
              <div style="flex:0 0 100px"><label>Year</label><input type="number" id="em-year" /></div>
              <div style="flex:1"><label>Venue</label><input type="text" id="em-venue" /></div>
              <div style="flex:0 0 100px"><label>N subjects</label><input type="number" id="em-subjects" min="0" /></div>
            </div>
            <div class="form-group"><label>Summary</label><textarea id="em-summary" style="min-height:70px"></textarea></div>
            <div class="form-group"><label>Notes <span style="text-transform:none;letter-spacing:0;opacity:.7">· **bold** __underline__ *italic* · ⌘/Ctrl+B U I</span></label><textarea id="em-desc"></textarea></div>
            <div class="form-group"><label>Tags</label><input type="text" id="em-tags" /></div>
            <div style="display:flex;gap:8px;justify-content:flex-end">
              <button class="btn btn-secondary" id="em-cancel">Cancel</button>
              <button class="btn btn-primary" id="em-save">Save Changes</button>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- Status bar -->
<div id="status-bar">
  <span><span class="save-dot" id="save-dot"></span><span id="status-txt">Ready · Ctrl+S to save</span></span>
  <span><span id="status-counts"></span> · <button class="link-btn" onclick="sync.openBackups()" title="Restore an automatic backup">↶ Backups</button></span>
</div>

<!-- Link edit popup (inline, positioned near clicked link) -->
<div id="link-popup">
  <div class="lp-from-to" id="lp-from-to"></div>
  <div class="form-group" style="margin-bottom:8px">
    <label>Relationship label</label>
    <input type="text" id="lp-label" list="rel-list" placeholder="e.g. uses, cites, extends..." />
  </div>
  <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px">
    <label class="lp-bidi"><input type="checkbox" id="lp-bidi" /> ↔ Both directions</label>
    <button class="btn btn-secondary btn-sm" id="lp-reverse" style="margin-left:auto" title="Swap From and To">⇄ Reverse</button>
  </div>
  <div style="display:flex;gap:6px">
    <button class="btn btn-primary btn-sm" id="lp-save">Save</button>
    <button class="btn btn-danger btn-sm" id="lp-delete">Delete</button>
    <button class="btn btn-secondary btn-sm" id="lp-cancel" style="margin-left:auto">×</button>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script>
// ============================================================
// DATA & CONSTANTS
// ============================================================
const TYPE_COLORS = {
  Applied:'#4361ee', Model:'#7209b7', Method:'#4cc9f0',
  Data:'#06d6a0', Review:'#f72585', Toolbox:'#f77f00'
};
const TYPE_ICONS = {
  Applied:'🔬', Model:'🧠', Method:'🛠', Data:'🗃', Review:'📝', Toolbox:'🧰'
};
// Older type names → current ones (Concept→Model, Source→Applied, Gap→Review, Application→Toolbox)
const LEGACY_TYPES = { Paper:'Applied', Source:'Applied', Dataset:'Data', Concept:'Model', Gap:'Review', Application:'Toolbox' };

let G = { nodes:[], links:[], categories:[], metadata:{} };
let selectedType = 'Applied';
let editNodeId = null;
let currentView = 'studies';

// ============================================================
// INIT & PERSISTENCE (browser copy + linked literature.json — see createFileSync in common.js)
// ============================================================
const sync = createFileSync({
  fileName:'literature.json', lsKey:'ml-kg', idbName:'ml-kg-handles', backupKey:'ml-kg-backups',
  itemsKey:'nodes', itemsLabel:'nodes',
  snapshot: () => { normalizeLinks(); return JSON.parse(JSON.stringify(G)); },
  apply: data => { setData(data); updateAll(); },
  meta: () => G.metadata,
  linkKey: l => `${sid(l)}|${tid(l)}|${l.label||''}`,
});

function init() {
  const studyLink = location.hash.match(/^#study=(.*)$/); // read before renderStudies() rewrites the hash
  const local = sync.loadLocal();
  if (local) setData(local);
  setupUI();
  updateAll();
  setStatus('Ready · Ctrl/Cmd+S to save', false);
  sync.start();
  // Studies is the default (first) view; a #study= link opens a specific one
  if (studyLink) openStudy(decodeURIComponent(studyLink[1]));
  else document.querySelector('[data-view="studies"]').click();
}

function migrateNode(n) {
  if (LEGACY_TYPES[n.type]) n.type = LEGACY_TYPES[n.type];
  n.tags = uniqTags(Array.isArray(n.tags) ? n.tags : []);
  if (!Array.isArray(n.projects)) n.projects = n.project ? [n.project] : [];
  delete n.project;
  if (n.url == null) n.url = '';
  if (n.summary == null) n.summary = '';
  return n;
}

// Replace the in-memory graph (from the browser copy, a file or a backup)
function setData(data) {
  G.nodes = (data.nodes || []).map(migrateNode);
  G.links = data.links || [];
  G.categories = data.categories || [];
  G.metadata = {...(data.metadata || {}), project:'Literature'};
  normalizeLinks();
}

// ============================================================
// NODE OPERATIONS
// ============================================================
function typeColor(t) { return TYPE_COLORS[t] || '#818cf8'; }

// ============================================================
function addNode() {
  const label = document.getElementById('node-label').value.trim();
  if (!label) { toast('Enter a name first'); return; }

  const n = {
    id: uid(),
    label,
    type: selectedType,
    projects: splitList(document.getElementById('node-projects').value),
    url: document.getElementById('node-url').value.trim(),
    summary: document.getElementById('node-summary').value.trim(),
    authors: document.getElementById('node-authors').value.trim(),
    year: parseInt(document.getElementById('node-year').value)||null,
    venue: document.getElementById('node-venue').value.trim(),
    subjects: parseN(document.getElementById('node-subjects').value),
    description: document.getElementById('node-desc').value.trim(),
    tags: uniqTags(splitList(document.getElementById('node-tags').value)),
    created: new Date().toISOString(),
    updated: new Date().toISOString()
  };

  G.nodes.push(n);

  // Clear form
  ['node-label','node-url','node-summary','node-authors','node-desc','node-tags','node-venue','node-subjects'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('node-year').value='';

  updateAll();
  sync.changed();
  toast(`Added: ${label}`);
}

async function deleteNode(id) {
  const n = G.nodes.find(n=>n.id===id); if (!n) return;
  const k = G.links.filter(l=>sid(l)===id || tid(l)===id).length;
  if (!await confirmDelete(`Delete “${n.label}”?`, k ? `Its ${k} connection${k===1?'':'s'} will be deleted too.` : '')) return;
  G.nodes = G.nodes.filter(n=>n.id!==id);
  G.links = G.links.filter(l=>sid(l)!==id && tid(l)!==id);
  if (selectedId === id) closeDetail();
  if (editNodeId === id) closeEdit();
  updateAll(); sync.changed();
  toast('Node deleted');
}

// Links are directed (source → target, "A uses B") unless `bidirectional: true` (A ↔ B).
// Same pair: A → B and B → A may both exist; a ↔ link covers both directions, so it blocks either.
function linkExists(src, tgt, bidi, exceptId) {
  return G.links.some(l => l.id!==exceptId &&
    ((sid(l)===src && tid(l)===tgt) || ((bidi || l.bidirectional) && sid(l)===tgt && tid(l)===src)));
}

function createLink(src, tgt, rel, bidi) {
  if (!src||!tgt) { toast('Select both nodes'); return false; }
  if (src===tgt) { toast('Cannot link to itself'); return false; }
  if (linkExists(src, tgt, bidi)) { toast('Connection exists'); return false; }
  const l = { id:uid(), source:src, target:tgt, label:rel, created:new Date().toISOString() };
  if (bidi) l.bidirectional = true;
  G.links.push(l);
  if (selectedId) openDetail(selectedId);
  updateAll(); sync.changed();
  toast('Connection added');
  return true;
}

// A node's links split by direction → { out:[{l,other}], in:[…], both:[…] }
function nodeLinks(id) {
  const r = { out:[], in:[], both:[] };
  for (const l of G.links) {
    const s = sid(l), t = tid(l);
    if (s!==id && t!==id) continue;
    const other = G.nodes.find(n=>n.id===(s===id ? t : s));
    if (other) (l.bidirectional ? r.both : s===id ? r.out : r.in).push({ l, other });
  }
  return r;
}

function addEdge() {
  const rel = document.getElementById('edge-rel').value.trim() || document.getElementById('edge-rel-preset').value || '';
  const bidi = document.getElementById('edge-bidi');
  if (!createLink(document.getElementById('edge-src').value, document.getElementById('edge-tgt').value, rel, bidi.checked)) return;
  document.getElementById('edge-rel').value='';
  document.getElementById('edge-rel-preset').value='';
  bidi.checked = false;
}

// "+ Link" row in the Details tab: this → target
function addLinkFromDetail() {
  const rel = document.getElementById('dl-rel'), bidi = document.getElementById('dl-bidi');
  if (!createLink(selectedId, document.getElementById('dl-tgt').value, rel.value.trim(), bidi.checked)) return;
  rel.value = ''; bidi.checked = false; document.getElementById('dl-arrow').textContent = '→';
}

async function deleteLink(id) {
  const l = G.links.find(l=>l.id===id); if (!l) return;
  const name = nid => G.nodes.find(n=>n.id===nid)?.label || '?';
  if (!await confirmDelete('Delete this connection?', `${name(sid(l))} → ${name(tid(l))}${l.label ? ` (${l.label})` : ''}`)) return;
  G.links = G.links.filter(l=>l.id!==id);
  closeLinkPopup();
  if (selectedId) openDetail(selectedId);
  updateAll(); sync.changed();
  toast('Connection deleted');
}

// ============================================================
// LINK POPUP
// ============================================================
let activeLinkId = null;

function closeLinkPopup() {
  document.getElementById('link-popup').classList.remove('open');
  activeLinkId = null;
}

function saveLinkEdit() {
  if (!activeLinkId) return;
  const link = G.links.find(l=>l.id===activeLinkId);
  if (!link) return;
  const bidi = document.getElementById('lp-bidi').checked;
  if (bidi && !link.bidirectional && linkExists(sid(link), tid(link), true, link.id)) {
    toast('The reverse link already exists — delete it first'); return;
  }
  link.label = document.getElementById('lp-label').value.trim();
  if (bidi) link.bidirectional = true; else delete link.bidirectional;
  closeLinkPopup();
  if (selectedId) openDetail(selectedId);
  updateAll(); sync.changed();
  toast('Connection updated');
}

// ⇄ Reverse in the link popup: swap source and target
function reverseLink() {
  const link = G.links.find(l=>l.id===activeLinkId);
  if (!link) return;
  if (linkExists(tid(link), sid(link), link.bidirectional, link.id)) { toast('The reverse link already exists'); return; }
  [link.source, link.target] = [tid(link), sid(link)];
  setLinkPopupEnds(link);
  if (selectedId) openDetail(selectedId);
  updateAll(); sync.changed();
  toast('Connection reversed');
}

function setLinkPopupEnds(link) {
  const name = id => esc(G.nodes.find(n=>n.id===id)?.label || '?');
  document.getElementById('lp-from-to').innerHTML =
    `<strong>${name(sid(link))}</strong> ${link.bidirectional ? '↔' : '→'} <strong>${name(tid(link))}</strong>`;
}

// ============================================================
// SELECTION & DETAIL PANEL
// ============================================================
let selectedId = null;

// Open a node in the Details tab (from Studies cards, Timeline, connection list).
// The cards collapse to a strip; × Close returns to the view it was opened from.
let detailFrom = 'studies';
function showNode(id) {
  if (!G.nodes.some(n=>n.id===id)) return;
  if (currentView==='studies' || currentView==='timeline') detailFrom = currentView;
  selectedId = id;
  openDetail(id);
  document.getElementById('details-tab').hidden = false;
  if (currentView!=='details') clickView('details');
  document.getElementById('st-detail').scrollTop = 0;
}

function clickView(v) { document.querySelector(`[data-view="${v}"]`).click(); }

// ============================================================
// TIMELINE VIEW
// ============================================================
// Two lanes, each with its own year range: Data on top, everything else (papers, methods, models…)
// below, each item marked with its type icon. One column per year the lane has items in; that year's
// items stack straight down below the axis, joined by a vertical dotted line (no angled leaders).
// Every year is visible without horizontal scrolling: when the years don't fit at a readable column
// width (TL.minCol), a lane wraps into bands (e.g. 2005–2019, then 2020–2027), like lines of text.
// Labels wrap onto up to 3 lines in their column (full title on hover). Filters: type, project, text.
const TLF = { types:new Set(), project:'', q:'' };   // empty types = all
const TL = { line:15, pad:6, vgap:6, minCol:88, maxCol:180, gapCol:18, margin:24 };
const TL_LANES = [
  { name:'Data', test:n=>n.type==='Data' },
  { name:'Methods, models and toolboxes', test:n=>n.type!=='Data' },
];

// Short display name. Data: OpenNeuro datasets always lead with their ds ID (from url / label / tags),
// followed by the dataset's own short name if it has one ("ds002785 AOMIC PIOP1", "ds003357"); other
// datasets use the short name ("CNeuroMod friends", "Cam-CAN"), else the first author.
// Others: "Lastname et al.", else the title.
function tlName(n) {
  const fa = firstAuthorEtAl(n.authors);
  if (n.type !== 'Data') return fa || n.label;
  const ds = [n.url, n.label, ...(n.tags||[])].join(' ').match(/\bds\d{6}\b/i)?.[0].toLowerCase();
  const s = n.label.split(' — ')[0].trim();
  const m = s.match(/^(.*?)\s*\(([^)]+)\)\s*(.*)$/);              // "Prefix (ACRONYM) rest"
  const short = m && m[1].length <= 18 ? m[1]
    : m && m[2].length <= 16 ? (m[2] + ' ' + m[3]).trim()
    : s.length <= 22 ? s : '';
  if (ds) return short && short.toLowerCase() !== ds ? `${ds} ${short}` : ds;
  return short || fa || n.label;
}

// Wrap text into at most maxLines lines of width maxW (words first, long words split); ellipsis if cut
function tlWrap(text, maxW, measure, maxLines = 3) {
  const words = text.split(/\s+/).flatMap(w => {          // split words wider than a line into chunks
    if (measure(w) <= maxW) return [w];
    const parts = []; let cur = '';
    for (const ch of w) { if (cur && measure(cur + ch + '-') > maxW) { parts.push(cur + '-'); cur = ch; } else cur += ch; }
    return [...parts, cur];
  });
  const lines = [];
  let line = '';
  for (const w of words) {
    const t = line ? (line.endsWith('-') ? line + w : line + ' ' + w) : w;
    if (line && measure(t) > maxW) { lines.push(line); line = w; } else line = t;
  }
  if (line) lines.push(line);
  if (lines.length > maxLines) {
    let last = lines[maxLines - 1];
    while (last.length > 1 && measure(last + '…') > maxW) last = last.slice(0, -1);
    lines.length = maxLines; lines[maxLines - 1] = last.replace(/-$/, '') + '…';
  }
  return lines.map(l => l.replace(/-(?= )/g, ''));
}

function tlFiltered() {
  const q = TLF.q.trim().toLowerCase();
  return G.nodes.filter(n => n.year
    && (!TLF.types.size || TLF.types.has(n.type))
    && (!TLF.project || (n.projects||[]).includes(TLF.project))
    && (!q || [n.label, n.authors, n.venue, ...(n.tags||[])].some(v => (v||'').toLowerCase().includes(q))));
}

// Filter bar: type toggles (with counts), project dropdown, text box
function renderTimelineBar() {
  // Rebuild the controls only when their options change, so a toggle keeps keyboard focus
  const types = Object.keys(TYPE_COLORS).filter(t => G.nodes.some(n => n.year && n.type===t));
  const box = document.getElementById('tl-types');
  const html = types.map(t => {
    const c = G.nodes.filter(n => n.year && n.type===t).length;
    const name = `<span class="tl-uname" style="text-decoration-color:${TYPE_COLORS[t]}">${esc(t)}</span>`;
    return `<label class="tl-check"><input type="checkbox" data-tltype="${esc(t)}">${name} <span class="n">${c}</span></label>`;
  }).join('');
  if (box.dataset.html !== html) { box.innerHTML = html; box.dataset.html = html; }
  box.querySelectorAll('input').forEach(i => { i.checked = TLF.types.has(i.dataset.tltype); });
  const sel = document.getElementById('tl-project');
  const opts = '<option value="">All projects</option>' + allProjects().map(p => `<option value="${esc(p)}">📚 ${esc(p)}</option>`).join('');
  if (sel.dataset.html !== opts) { sel.innerHTML = opts; sel.dataset.html = opts; }
  if (TLF.project && !allProjects().includes(TLF.project)) TLF.project = '';
  sel.value = TLF.project;
}

function drawTimeline() {
  renderTimelineBar();
  const svg = d3.select('#timeline-svg');
  svg.selectAll('*').remove();
  const items = tlFiltered().sort((a,b) => a.year-b.year || a.type.localeCompare(b.type) || a.label.localeCompare(b.label));
  const W = document.getElementById('tl-scroll').clientWidth;
  document.getElementById('tl-count').textContent = `${items.length} item${items.length===1?'':'s'}`;
  svg.attr('width', W).attr('viewBox', null);
  // Liquid-glass box paint: translucent vertical gradient fill + bright top edge (colours from CSS vars per theme)
  const defs = svg.append('defs');
  const grad = (id, c1, c2) => { const lg = defs.append('linearGradient').attr('id', id).attr('x1', 0).attr('y1', 0).attr('x2', 0).attr('y2', 1);
    lg.append('stop').attr('offset', '0%').attr('class', c1); lg.append('stop').attr('offset', '100%').attr('class', c2); };
  grad('tl-glass', 'tl-g1', 'tl-g2'); grad('tl-glass-edge', 'tl-e1', 'tl-e2');
  if (!items.length) {
    svg.attr('height', 80).append('text').attr('class', 'tl-note').attr('x', TL.margin).attr('y', 40)
      .text('No items with a year match these filters.');
    return;
  }

  const inner = W - 2 * TL.margin;
  const meas = svg.append('text').attr('class', 'tl-label').style('visibility', 'hidden');
  const measure = t => { meas.text(t); return meas.node().getComputedTextLength(); };
  const lanes = TL_LANES.map(l => ({ ...l, byYear: d3.group(items.filter(l.test), n => n.year) })).filter(l => l.byYear.size);
  let y = 28;

  lanes.forEach((lane, li) => {
    const years = [...lane.byYear.keys()].sort((a,b) => a-b);
    const count = d3.sum(years, yr => lane.byYear.get(yr).length);
    // Title + subtitle, left-aligned like an Observable chart
    svg.append('text').attr('class', 'tl-title').attr('x', TL.margin).attr('y', y).text(lane.name);
    svg.append('text').attr('class', 'tl-subtitle').attr('x', TL.margin).attr('y', y + 18)
      .text(`${count} item${count===1?'':'s'}, ${years.length > 1 ? `${years[0]}–${years[years.length - 1]}` : years[0]}`);
    y += 34;

    // Bands: as many year columns as fit at a readable width (TL.minCol), balanced
    let perBand = Math.max(1, Math.floor(inner / TL.minCol));
    const nBands = Math.ceil(years.length / perBand);
    perBand = Math.ceil(years.length / nBands);

    d3.range(nBands).forEach(bi => {
      const bandYears = years.slice(bi * perBand, (bi + 1) * perBand);
      const gapBefore = bandYears.map((yr, i) => i > 0 && yr - bandYears[i-1] > 1);   // skipped years
      const cw = Math.min(TL.maxCol, (inner - gapBefore.filter(Boolean).length * TL.gapCol) / perBand);
      let acc = TL.margin;
      const colX = bandYears.map((yr, i) => { if (gapBefore[i]) acc += TL.gapCol; const x = acc; acc += cw; return x; });
      const axisY = y + 18;
      const g = svg.append('g');

      // Axis: year labels above a thin domain line, short ticks (axisTop look)
      g.append('path').attr('class', 'tl-domain').attr('d', `M${TL.margin},${axisY}H${acc}`);
      let bottom = axisY;
      bandYears.forEach((yr, i) => {
        const cx = colX[i] + cw / 2, stack = lane.byYear.get(yr);
        g.append('text').attr('class', 'tl-year').attr('x', cx).attr('y', axisY - 8).attr('text-anchor', 'middle').text(yr);
        if (gapBefore[i]) g.append('text').attr('class', 'tl-break').attr('x', colX[i] - TL.gapCol / 2).attr('y', axisY - 8)
          .attr('text-anchor', 'middle').text('…');
        // Stack: labels hang below the tick on a faint rule; a halo in the background colour keeps them legible
        // Each item is an invisible block: the full column width, padded, stacked with a small gap
        let top = axisY + 8;
        const bw = cw - 10;
        const rule = g.append('line').attr('class', 'tl-rule').attr('x1', cx).attr('x2', cx).attr('y1', axisY);
        stack.forEach(n => {
          const lines = tlWrap(tlName(n), bw - 2 * TL.pad, measure);
          const h = lines.length * TL.line + 2 * TL.pad, base = top + TL.pad + 11;   // first baseline
          const it = g.append('g').attr('class', 'tl-item')
            .attr('tabindex', 0).attr('role', 'button').attr('aria-label', `${n.type}: ${n.label}, ${n.year}`)
            .on('click', () => showNode(n.id))
            .on('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); showNode(n.id); } });
          it.append('rect').attr('class', 'tl-hit').attr('x', cx - bw / 2).attr('y', top).attr('width', bw).attr('height', h).attr('rx', 10);
          const t = it.append('text').attr('class', 'tl-label').attr('text-anchor', 'middle').attr('y', base);
          lines.forEach((l, k) => t.append('tspan').attr('x', cx).attr('dy', k ? TL.line : 0).text(l));
          // Hover / focus: the label gets an underline in its category colour
          lines.forEach((l, k) => {
            const w = measure(l), ly = base + k * TL.line + 3.5;
            it.insert('line', 'text').attr('class', 'tl-under').attr('x1', cx - w / 2).attr('x2', cx + w / 2)
              .attr('y1', ly).attr('y2', ly).style('stroke', typeColor(n.type));
          });
          it.append('title').text(`${n.type} · ${n.label} (${n.year})${n.authors ? '\n' + n.authors : ''}`);
          rule.attr('y2', base);
          top += h + TL.vgap;
        });
        g.append('line').attr('class', 'tl-tick').attr('x1', cx).attr('x2', cx).attr('y1', axisY).attr('y2', axisY + 6);
        bottom = Math.max(bottom, top);
      });
      y = bottom + 30;
    });
    if (li < lanes.length - 1) y += 16;
  });
  meas.remove();
  svg.attr('height', y);
}

// Filter bar events (set up once from setupUI)
function setupTimelineBar() {
  // Type checkboxes: none checked = all types
  document.getElementById('tl-types').addEventListener('change', e => {
    const t = e.target.dataset.tltype; if (!t) return;
    e.target.checked ? TLF.types.add(t) : TLF.types.delete(t);
    drawTimeline();
  });
  document.getElementById('tl-project').addEventListener('change', e => { TLF.project = e.target.value; drawTimeline(); });
  document.getElementById('tl-q').addEventListener('input', e => { TLF.q = e.target.value; drawTimeline(); });
}

// ============================================================
// UI SETUP
// ============================================================
function setupUI() {
  // Type selector
  document.querySelectorAll('.type-card').forEach(card=>{
    card.addEventListener('click',()=>{
      document.querySelectorAll('.type-card').forEach(c=>c.classList.remove('selected'));
      card.classList.add('selected');
      selectedType=card.dataset.type;
      const showPaper=['Applied','Review','Method','Data','Toolbox'].includes(selectedType);
      document.getElementById('paper-fields').style.display=showPaper?'block':'none';
    });
  });

  // Tab switching
  document.querySelectorAll('.tab-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tab-'+btn.dataset.tab).classList.add('active');
    });
  });

  // View switching
  function switchToView(view) {
    currentView = view;
    document.getElementById('timeline-container').classList.toggle('active', view==='timeline');
    const sc = document.getElementById('studies-container');
    const paned = view==='details' || view==='edit';   // cards collapse to the » Cards strip
    sc.classList.toggle('active', view==='studies' || paned);
    sc.classList.toggle('paned', paned);
    sc.dataset.pane = paned ? view : '';
  }

  document.querySelectorAll('.view-tab').forEach(btn=>{
    btn.addEventListener('click',()=>{
      document.querySelectorAll('.view-tab').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      switchToView(btn.dataset.view);
      if(currentView==='timeline') drawTimeline();
      if(currentView==='studies') renderStudies();
    });
  });

  // Notes formatting shortcuts (⌘/Ctrl + B / U / I)
  // (guarded: a stale cached common.js without it must not stop init() before the JSON loads)
  if (typeof enableNoteShortcuts === 'function')
    ['node-desc','em-desc'].forEach(id=>enableNoteShortcuts(document.getElementById(id)));

  // Studies controls
  document.getElementById('st-q').addEventListener('input', e=>{ ST.query=e.target.value; ST.kw.clear(); renderStudies(); });
  document.getElementById('st-filter').addEventListener('input', e=>{ ST.filter=e.target.value; renderStudies(); });
  document.getElementById('st-nmin').addEventListener('input', e=>{ ST.nmin=parseN(e.target.value); renderStudies(); });
  document.getElementById('st-sort').addEventListener('change', e=>{ ST.sort=e.target.value; renderStudies(); });  document.getElementById('st-copy').addEventListener('click', copyStudyMarkdown);
  window.addEventListener('hashchange', applyStudyHash);

  // Buttons
  document.getElementById('btn-add-node').addEventListener('click',addNode);
  document.getElementById('btn-add-edge').addEventListener('click',addEdge);
  document.getElementById('btn-open').addEventListener('click',()=>sync.open());
  document.getElementById('btn-save').addEventListener('click',()=>sync.save());
  document.getElementById('btn-export').addEventListener('click',()=>sync.exportCopy());

  // Enter key on label field
  document.getElementById('node-label').addEventListener('keydown',e=>{ if(e.key==='Enter') addNode(); });

  // Detail panel close
  document.getElementById('dp-close').addEventListener('click', closeDetail);

  // Details / Edit tabs (the Cards strip shows the cards; Details / Edit stay in their tabs)
  document.getElementById('em-cancel').addEventListener('click',closeEdit);
  document.getElementById('em-save').addEventListener('click',saveEdit);
  document.getElementById('st-cards-strip').addEventListener('click',()=>clickView('studies'));
  document.getElementById('dl-add').addEventListener('click', addLinkFromDetail);
  document.getElementById('dl-rel').addEventListener('keydown', e=>{ if (e.key==='Enter') addLinkFromDetail(); });
  document.getElementById('dl-bidi').addEventListener('change', e=>{ document.getElementById('dl-arrow').textContent = e.target.checked ? '↔' : '→'; });
  document.getElementById('lp-reverse').addEventListener('click', reverseLink);

  // Edge rel preset → fill text input
  document.getElementById('edge-rel-preset').addEventListener('change',e=>{
    if(e.target.value) document.getElementById('edge-rel').value=e.target.value;
  });

  // Link popup buttons
  document.getElementById('lp-save').addEventListener('click', saveLinkEdit);
  document.getElementById('lp-delete').addEventListener('click', ()=>{ if(activeLinkId) deleteLink(activeLinkId); });
  document.getElementById('lp-cancel').addEventListener('click', closeLinkPopup);
  document.getElementById('lp-label').addEventListener('keydown', e=>{
    if (e.key==='Enter') saveLinkEdit();
    if (e.key==='Escape') closeLinkPopup();
  });
  // Close link popup when clicking outside it
  document.addEventListener('click', e=>{
    const popup=document.getElementById('link-popup');
    if (popup.classList.contains('open') && !popup.contains(e.target)) closeLinkPopup();
  });

  // Keyboard
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape'){ if (currentView==='details') closeDetail(); closeLinkPopup(); }
    if((e.ctrlKey||e.metaKey)&&e.key==='s'){ e.preventDefault(); sync.save(); }
  });

  setupTimelineBar();
  // Timeline fits the page: redraw on resize
  let tlResize;
  window.addEventListener('resize', ()=>{ clearTimeout(tlResize); tlResize = setTimeout(()=>{ if (currentView==='timeline') drawTimeline(); }, 120); });

  // Sidebar collapse toggle (always starts collapsed)
  document.getElementById('sb-toggle').addEventListener('click', ()=>
    setSidebar(document.getElementById('sidebar').classList.contains('collapsed')));
}

// Open (true) or collapse (false) the Add / Link sidebar
function setSidebar(open) {
  const sb = document.getElementById('sidebar'), btn = document.getElementById('sb-toggle');
  if (sb.classList.contains('collapsed') !== open) return;
  sb.classList.toggle('collapsed', !open);
  btn.querySelector('.sb-arrow').textContent = open ? '«' : '»';
  btn.title = open ? 'Hide sidebar' : 'Show sidebar (Add / Link)';
  btn.setAttribute('aria-expanded', String(open));
}

// ============================================================
// UTILS
// ============================================================
function normalizeLinks() {
  G.links=G.links.map(l=>({...l,source:sid(l),target:tid(l)}));
}
function allProjects(){ return [...new Set(G.nodes.flatMap(n=>n.projects||[]))].sort((a,b)=>a.localeCompare(b)); }

// ============================================================
// STUDIES VIEW — search a project, boxed summaries, keyword filters
// ============================================================
const ST = { query:'', filter:'', nmin:null, sort:'added', kwOpen:false, railOpen:false, kw:new Set(), mode:'all', visible:[], title:'', projects:[] };

// Number of subjects / participants (`subjects` field, whole number or null)
// Keyword categories for the Studies filter. A tag is shown there only if it belongs to one of these
// (exact match, or `prefix` for access:*); everything else stays visible on the cards only.
const KW_GROUPS = [
  { name:'Modality',    tags:['fmri','smri','dwi','asl','mrs','flair','eeg','ieeg','meg','physio','eye tracking','wearables'] },
  { name:'Physio',      tags:['ecg','ppg','eda','respiration','co2','capnography','blood pressure','heart rate','hrv','rvt','eog'] },
  { name:'Access',      prefix:'access:' },
  { name:'Paradigm',    tags:['resting-state','task-fmri','naturalistic','movie-watching','video game','breath-hold','visual stimulation',
                              'motor task','localizer','reading','language','music','emotion','memory','working memory','cognitive control',
                              'driving','olfaction'] },
  { name:'Population',  tags:['aging','development','lifespan','clinical','epilepsy','alzheimer','twins','community sample','population cohort','cross-cultural'] },
  { name:'Design',      tags:['dense sampling','test-retest','longitudinal','multi-site','intervention','rct','benchmark','sleep deprivation'] },
  { name:'Acquisition', tags:['3t','7t','multi-echo','multiband','fast fmri','high-resolution'] },
  { name:'Collection',  tags:['openneuro','cneuromod','tuh-eeg','hcp','aomic','abcd','ukb','adni','cam-can','nki-rs','wildppg','corr','algonauts','seed'] },
  { name:'Format',      tags:['bids'] },
];
const KW_INDEX = new Map(KW_GROUPS.flatMap(g => (g.tags||[]).map((t,i)=>[t,{g,i}])));
function kwGroupOf(k) { return KW_INDEX.get(k)?.g || KW_GROUPS.find(g=>g.prefix && k.startsWith(g.prefix)) || null; }
// → [{name, strip, items:[[key,{label,count}], …]}] in KW_GROUPS order, items in list order (prefix groups A–Z)
function groupKeywords(kwCounts) {
  return KW_GROUPS.map(g => {
    const items = [...kwCounts.entries()].filter(([k]) => kwGroupOf(k) === g)
      .sort((a,b) => g.prefix ? byAlpha(a[0],b[0]) : KW_INDEX.get(a[0]).i - KW_INDEX.get(b[0]).i);
    return { name:g.name, strip:g.prefix||'', items };
  }).filter(g => g.items.length);
}

// Notes → HTML with **bold** / __underline__ / *italic*; plain escaped text if common.js is an old cached copy
function notesHTML(v) { return typeof fmtNotes === 'function' ? fmtNotes(v) : esc(v); }
function parseN(v) { const x = parseInt(v, 10); return Number.isFinite(x) && x >= 0 ? x : null; }
function hasN(n) { return Number.isFinite(n.subjects); }
function fmtN(n) { return hasN(n) ? `N = ${n.subjects.toLocaleString()}` : ''; }

function openStudy(name) {
  ST.query = name; ST.filter = ''; ST.kw.clear();
  document.getElementById('st-q').value = name;
  document.getElementById('st-filter').value = '';
  document.querySelector('[data-view="studies"]').click();
}

function applyStudyHash() {
  const m = location.hash.match(/^#study=(.*)$/);
  if (m) openStudy(decodeURIComponent(m[1]));
}

// Resolve the query to a set of projects (exact match wins, else substring).
// Falls back to tag matching when no project name matches.
function resolveStudy(q) {
  q = q.trim().toLowerCase();
  const projs = allProjects();
  if (!q) return { projects:[], nodes:[], viaTag:false };
  let hit = projs.filter(p=>p.toLowerCase()===q);
  if (!hit.length) hit = projs.filter(p=>p.toLowerCase().includes(q));
  if (hit.length) {
    const set = new Set(hit);
    return { projects:hit, nodes:G.nodes.filter(n=>(n.projects||[]).some(p=>set.has(p))), viaTag:false };
  }
  const nodes = G.nodes.filter(n=>(n.tags||[]).some(t=>t.toLowerCase().includes(q)));
  return { projects:[], nodes, viaTag:true };
}

function renderStudies() {
  const rail = document.getElementById('st-rail');
  const main = document.getElementById('st-main');
  const projs = allProjects();
  const q = ST.query.trim().toLowerCase();

  const res = resolveStudy(ST.query);
  ST.projects = res.projects;
  const activeSet = new Set(res.projects);
  // Project rail: collapsed (default) = thin strip with » "Projects"; open = list with « in its header
  rail.classList.toggle('collapsed', !ST.railOpen);
  const railToggle = `<button class="st-railtoggle" data-act="rail" title="${ST.railOpen?'Hide projects':'Show projects'}" aria-expanded="${ST.railOpen}">${ST.railOpen?'«':'»'}<span class="sb-vlabel">Projects</span></button>`;
  if (!ST.railOpen) rail.innerHTML = railToggle;
  else rail.innerHTML = `<div class="st-railhead"><span class="dp-section-title">Studies / Projects</span>${railToggle}</div>` + (projs.length
    ? projs.map(p=>{
        const c = G.nodes.filter(n=>(n.projects||[]).includes(p)).length;
        return `<div class="st-proj ${activeSet.has(p)?'active':''}" data-act="study" data-v="${esc(p)}" title="${esc(p)}">
          <span class="st-proj-name">📚 ${esc(p)}</span><span class="st-proj-count">${c}</span></div>`;
      }).join('')
    : '<div style="color:var(--c555);font-size:11px;line-height:1.6">No projects yet. Add a “Study / Project” to any node (Add form or Edit).</div>');

  try { history.replaceState(null,'', q ? '#study='+encodeURIComponent(ST.query.trim()) : location.pathname+location.search); } catch(_) {}

  if (!q) {
    ST.visible = [];
    main.innerHTML = `<div class="st-empty">Type a study or project name above, or open the » Projects strip on the left to pick one.<br><br>
      Results show each source's title, URL and summary in its own box, with keyword filters.</div>`;
    return;
  }

  // Keyword + text filters
  let nodes = res.nodes.slice();
  const kwCounts = new Map(); // key → {label, count}
  nodes.forEach(n=>uniqTags(n.tags).forEach(t=>{
    const e = kwCounts.get(tkey(t)) || {label:t, count:0}; e.count++; kwCounts.set(tkey(t), e);
  }));
  [...ST.kw].forEach(k=>{ if(!kwCounts.has(k)) ST.kw.delete(k); });
  if (ST.kw.size) {
    nodes = nodes.filter(n=>{
      const t = new Set((n.tags||[]).map(tkey));
      return ST.mode==='all' ? [...ST.kw].every(k=>t.has(k)) : [...ST.kw].some(k=>t.has(k));
    });
  }
  const f = ST.filter.trim().toLowerCase();
  if (f) nodes = nodes.filter(n=>[n.label,n.summary,n.description,n.authors,n.venue].some(v=>(v||'').toLowerCase().includes(f)));
  // Subject-count range: items without N are hidden while a bound is set
  if (ST.nmin!=null) nodes = nodes.filter(n=>hasN(n) && n.subjects>=ST.nmin);

  // Sort: date added (newest first, default) / most used (Used by count) / number of subjects (largest N first)
  const byAdded = (a,b)=>(b.created||'').localeCompare(a.created||'') || a.label.localeCompare(b.label);
  const SORTS = {
    added: byAdded,
    used:  (a,b)=>usedBy(b)-usedBy(a) || byAdded(a,b),
    n:     (a,b)=>(hasN(b)?b.subjects:-1)-(hasN(a)?a.subjects:-1) || byAdded(a,b),
  };
  nodes.sort(SORTS[ST.sort] || byAdded);
  ST.visible = nodes;
  ST.title = res.viaTag ? `Keyword: ${ST.query.trim()}` : res.projects.join(', ');

  const head = res.viaTag
    ? `<h2>🏷 ${esc(ST.query.trim())}</h2><div class="st-sub">No project by that name — showing items tagged with it.</div>`
    : `<h2>📚 ${esc(res.projects.join(' · '))}</h2>`;

  // Keyword filter: only categorized keywords, one row per category (KW_GROUPS); others stay on the cards
  const chip = (k, label, count) =>
    `<span class="st-chip ${ST.kw.has(k)?'on':''}" data-act="kw" data-v="${esc(k)}">${esc(label)}<span class="n">${count}</span></span>`;
  const kwRows = groupKeywords(kwCounts).map(g =>
    `<div class="st-kwrow"><span class="st-kwgroup">${esc(g.name)}</span>${g.items.map(([k,{label,count}])=>chip(k, g.strip ? label.slice(g.strip.length) : label, count)).join('')}</div>`);
  // A keyword picked from a card that isn't in any category still needs a chip to turn it off
  const loose = [...ST.kw].filter(k=>!kwGroupOf(k) && kwCounts.has(k));
  if (loose.length) kwRows.push(`<div class="st-kwrow"><span class="st-kwgroup">Selected</span>${loose.map(k=>chip(k, kwCounts.get(k).label, kwCounts.get(k).count)).join('')}</div>`);
  const chips = kwRows.join('');

  main.innerHTML = `
    <div class="st-head">${head}
      <div class="st-sub">${nodes.length} of ${res.nodes.length} item${res.nodes.length!==1?'s':''}${ST.nmin!=null?` · N ≥ ${ST.nmin} (items without N hidden)`:''}</div>
    </div>
    ${kwRows.length ? `<details class="st-section st-kwbox" id="st-kwbox" ${ST.kwOpen?'open':''}>
      <summary class="st-section-title">Filter by keyword${ST.kw.size?` <span class="st-kwactive">${ST.kw.size} active · ${ST.mode==='all'?'ALL':'ANY'}</span>`:''}</summary>
      <div class="st-kwtools">
        <button class="btn btn-secondary btn-sm" data-act="mode" style="text-transform:none;letter-spacing:0">Match: ${ST.mode==='all'?'ALL':'ANY'}</button>
        ${ST.kw.size?`<button class="btn btn-secondary btn-sm" data-act="clearkw" style="text-transform:none;letter-spacing:0">Clear</button>`:''}
      </div>${chips}</details>` : ''}
    ${nodes.length ? `<div class="st-grid">${nodes.map(studyCard).join('')}</div>`
      : `<div class="st-empty">${res.nodes.length ? 'No items match these filters.' : 'No matches.'}${!res.nodes.length && projs.length ? `<br><br>Known projects: ${projs.map(esc).join(', ')}` : ''}</div>`}`;
}

function studyCard(n) {
  const c = typeColor(n.type);
  const title = n.url
    ? `<a class="st-title" href="${esc(safeUrl(n.url))}" target="_blank" rel="noopener">${esc(n.label)}</a>`
    : `<span class="st-title">${esc(n.label)}</span>`;
  const meta = [shortAuthors(n.authors), n.year, n.venue, fmtN(n)].filter(Boolean).map(esc).join(' · ');
  const others = (n.projects||[]).filter(p=>!ST.projects.includes(p));
  return `<div class="st-card" style="border-top:3px solid ${c}">
    <div class="st-card-top">${title}
      <span class="dp-badge" style="background:${c}22;color:${c}">${TYPE_ICONS[n.type]||''} ${esc(n.type)}</span></div>
    ${n.url ? `<a class="st-url" href="${esc(safeUrl(n.url))}" target="_blank" rel="noopener">${esc(n.url)}</a>` : ''}
    ${meta || usedBy(n) ? `<div class="st-meta">${meta}${usedBy(n) ? `${meta ? ' ' : ''}<span class="st-usedby" data-act="details" data-v="${esc(n.id)}" title="Open Details to see what uses it">🔗 Used by ${usedBy(n)}</span>` : ''}</div>` : ''}
    ${n.summary ? `<div class="st-summary">${esc(n.summary)}</div>`
      : `<div class="st-summary empty" data-act="edit" data-v="${esc(n.id)}">No summary yet — click to add one</div>`}
    ${(n.tags||[]).length ? `<div>${uniqTags(n.tags).map(t=>`<span class="st-chip ${ST.kw.has(tkey(t))?'on':''}" data-act="kw" data-v="${esc(tkey(t))}">${esc(t)}</span>`).join('')}</div>` : ''}
    ${others.length ? `<div class="st-also">Also in: ${others.map(p=>`<span class="tag proj" data-act="study" data-v="${esc(p)}">📚 ${esc(p)}</span>`).join('')}</div>` : ''}
    ${cardLinks(n)}
    ${n.description ? `<details><summary>Notes</summary><div class="st-notes">${notesHTML(n.description)}</div></details>` : ''}
    <div class="st-foot">
      <button class="btn btn-secondary btn-sm" data-act="details" data-v="${esc(n.id)}">ⓘ Details</button>
      <button class="btn btn-secondary btn-sm" data-act="edit" data-v="${esc(n.id)}">✏ Edit</button>
    </div>
  </div>`;
}

// "Used by": how many other items link to this one (incoming or ↔ links)
const USED_BY_TYPES = new Set(['Data','Method','Toolbox','Model']);
function usedBy(n) {
  if (!USED_BY_TYPES.has(n.type)) return 0;
  const L = nodeLinks(n.id);
  return new Set([...L.in, ...L.both].map(x=>x.other.id)).size;
}

// Card lines for a node's links, grouped by label: "uses → A, B" (outgoing), "C → uses this" (incoming), "overlaps ↔ D"
function cardLinks(n) {
  const L = nodeLinks(n.id);
  const name = o => `<span class="st-link" data-act="details" data-v="${esc(o.id)}">${esc(o.label)}</span>`;
  const group = arr => { const m = new Map(); arr.forEach(({l,other}) => { const k = l.label || 'linked'; m.has(k) ? m.get(k).push(other) : m.set(k,[other]); }); return [...m]; };
  const rows = [
    ...group(L.out).map(([k,os]) => `<b>${esc(k)}</b> → ${os.map(name).join(', ')}`),
    ...group(L.in).map(([k,os]) => `${os.map(name).join(', ')} → <b>${esc(k)}</b> this`),
    ...group(L.both).map(([k,os]) => `<b>${esc(k)}</b> ↔ ${os.map(name).join(', ')}`),
  ];
  return rows.length ? `<div class="st-links">${rows.map(r=>`<div>${r}</div>`).join('')}</div>` : '';
}

// "Jane Smith, Bo Lee" / "Smith J; Lee B" / "Smith et al." → "Smith et al."; one author → "Smith"
function firstAuthorEtAl(a) {
  const s = String(a||'').trim();
  if (!s) return '';
  const etal = /\bet al\.?/i.test(s);
  const parts = s.replace(/\bet al\.?/i,'').split(/,|;|&|\band\b/i).map(x=>x.trim()).filter(Boolean);
  if (!parts.length) return '';
  // Last name = last word that isn't an initial ("J.", "JK")
  const words = parts[0].split(/\s+/);
  const last = [...words].reverse().find(w => !/^([A-Z]\.?){1,3}$/.test(w)) || words[0];
  return last + (etal || parts.length > 1 ? ' et al.' : '');
}

function shortAuthors(a) {
  const names = String(a||'').split(',').map(x=>x.trim()).filter(Boolean);
  return names.slice(0,3).join(', ') + (names.length>3 ? ' et al.' : '');
}

function copyStudyMarkdown() {
  if (!ST.visible.length) { toast('Nothing to copy'); return; }
  const md = `## ${ST.title}\n\n` + ST.visible.map(n=>{
    const meta = [n.authors, n.year, n.venue, fmtN(n)].filter(Boolean).join(' · ');
    return `###${n.url ? `[${n.label}](${n.url})` : n.label}\n` +
      (meta ? `${meta}\n` : '') +
      (n.summary ? `\n${n.summary}\n` : '') +
      ((n.tags||[]).length ? `\nKeywords: ${uniqTags(n.tags).join(', ')}\n` : '');
  }).join('\n');
  navigator.clipboard.writeText(md).then(()=>toast('Copied as Markdown'), ()=>toast('Clipboard not available'));
}

// Remember whether the keyword filter box is open across re-renders (collapsed by default; 'toggle' doesn't bubble → capture)
document.getElementById('studies-container').addEventListener('toggle', e=>{
  if (e.target.id === 'st-kwbox') ST.kwOpen = e.target.open;
}, true);

document.getElementById('studies-container').addEventListener('click', e=>{
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const v = el.dataset.v;
  switch (el.dataset.act) {
    case 'study': openStudy(v); break;
    case 'rail': ST.railOpen = !ST.railOpen; renderStudies(); break;
    case 'kw': ST.kw.has(v) ? ST.kw.delete(v) : ST.kw.add(v); renderStudies(); break;
    case 'mode': ST.mode = ST.mode==='all' ? 'any' : 'all'; renderStudies(); break;
    case 'clearkw': ST.kw.clear(); renderStudies(); break;
    case 'edit': openEdit(v); break;
    case 'details': showNode(v); break;
  }
});

// Start
init();
</script>
